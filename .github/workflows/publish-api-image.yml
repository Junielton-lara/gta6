name: Publish API image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/portainer/**'
      - '.github/workflows/publish-api-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Ajuste o namespace GHCR se o repositório for outro.
  IMAGE_NAME: junielton-lara/vco-api

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vco-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push vco-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
