# Stack Portainer — Vice City Online API
#
# Mesma VPS / Portainer do Staltek (+Gestor).
# No Portainer: Stacks → Add stack → Web editor
# Cole este arquivo e preencha as variáveis (modelo: stack.env.example).
#
# Porta alta 47193 no host (evita conflito com outros projetos na VPS).
# Frontend: Vercel (vercel.json faz proxy de /health e /socket.io).

services:
  api:
    image: ghcr.io/junielton-lara/vco-api:${API_IMAGE_TAG:-latest}
    container_name: vco-api
    restart: unless-stopped
    ports:
      - '47193:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      API_ONLY: 'true'
      ALLOW_NON_LAN: 'true'
      TRUST_PROXY: 'true'
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-30}
      # Origem do frontend na Vercel (QR code + CORS)
      APP_URL: ${APP_URL}
      # URL pública da API neste host
      API_URL: ${API_URL:-http://187.127.23.89:47193}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
