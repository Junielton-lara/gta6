# Nginx — Vice City Online (Ubuntu 24.04 + Certbot)
#
# 1. Substitua jogo.seudominio.com pelo domínio real
# 2. Copie para /etc/nginx/sites-available/vice-city-online
# 3. ln -s /etc/nginx/sites-available/vice-city-online /etc/nginx/sites-enabled/
# 4. Obtenha o certificado: certbot --nginx -d jogo.seudominio.com
# 5. nginx -t && systemctl reload nginx
#
# O Node/PM2 escuta apenas em 127.0.0.1:3000.
# HTTPS e WebSocket seguro (WSS) terminam aqui.

upstream vco_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jogo.seudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jogo.seudominio.com;

    # Certbot preenche estes caminhos automaticamente.
    ssl_certificate     /etc/letsencrypt/live/jogo.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jogo.seudominio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Segurança básica
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # Assets estáticos com cache longo (hash no nome via Vite)
    location ~* ^/(tv|controller)/assets/ {
        proxy_pass http://vco_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Socket.IO (WebSocket + long-polling)
    location /socket.io/ {
        proxy_pass http://vco_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://vco_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
